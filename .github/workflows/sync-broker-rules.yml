name: Sync broker rules

on:
  schedule:
    # UTC 02:23 / Asia/Shanghai 10:23
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-broker-rules.yml'
      - 'scripts/sync_broker_rules.py'
      - 'tests/**'
      - 'rules/**'

permissions:
  contents: write

concurrency:
  group: sync-broker-rules
  cancel-in-progress: false

jobs:
  sync:
    # Manual runs also target the default branch, matching scheduled runs.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test sync safeguards
        run: python3 -B -m unittest discover -s tests -v
      - name: Sync rules
        run: python3 -B scripts/sync_broker_rules.py
      - name: Commit changed rule files
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git diff --check
          git add -- shadowrocket/Futu.list shadowrocket/tiger.list
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Futu and Tiger broker rules'
          git push origin "HEAD:$TARGET_BRANCH"
