name: Sync adblock rules

on:
  schedule:
    # UTC 01:17 / Asia/Shanghai 09:17（上游每天 08:00 重建）
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-adblock-rules.yml'
      - 'scripts/sync_adblock_rules.py'
      - 'rules/adblock_exclude.txt'

permissions:
  contents: write

concurrency:
  group: sync-adblock-rules
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test
        run: python3 -B -m unittest tests.test_sync_adblock_rules -v
      - name: Sync rules
        run: python3 -B scripts/sync_adblock_rules.py
      - name: Commit changed rule file
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- shadowrocket/ADBlock.list
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync adblock rules'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
